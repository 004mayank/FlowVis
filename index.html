<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowVis - See how it actually works</title>
  <meta name="description" content="Interactive system flow visualizer for 109 products. See how WhatsApp, Stripe, Netflix, Uber and more actually work under the hood.">
  <meta name="keywords" content="system design, flow visualization, technical diagrams, WhatsApp, Stripe, Netflix, UPI">
  <meta property="og:title" content="FlowVis - See how it actually works">
  <meta property="og:description" content="Interactive system flow visualizer for 109 products.">
  <meta property="og:type" content="website">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/main.css">
  <style>
    #fv-loader{position:fixed;inset:0;z-index:9999;background:#0d0d12;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
      transition:opacity .3s ease;}
    #fv-loader.hidden{opacity:0;pointer-events:none;}
    .fv-loader-logo{display:flex;align-items:center;gap:10px;}
    .fv-loader-icon{width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg,#5b5df5,#9333ea,#22c55e);
      display:flex;align-items:center;justify-content:center;font-size:16px;}
    .fv-loader-text{font-family:'Inter',sans-serif;font-size:20px;font-weight:700;color:#f0f0f8;}
    .fv-loader-text b{color:#7b7df8;}
    .fv-loader-bar{width:160px;height:2px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;}
    .fv-loader-fill{height:100%;width:0%;border-radius:999px;
      background:linear-gradient(90deg,#5b5df5,#b58cff);
      animation:fv-load 1.4s ease forwards;}
    @keyframes fv-load{0%{width:0%}60%{width:75%}100%{width:92%}}
  </style>
</head>
<body>
  <div id="fv-loader">
    <div class="fv-loader-logo">
      <div class="fv-loader-icon">&#x26A1;</div>
      <div class="fv-loader-text">Flow<b>Vis</b></div>
    </div>
    <div class="fv-loader-bar"><div class="fv-loader-fill"></div></div>
  </div>

  <!-- Simple preview-mode routing (/?page=preview etc.) -->
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const page = params.get('page');
      if (!page) return;

      // Defer until app JS loads (if present). If showPage doesn't exist,
      // we still expose the intended page for later.
      window.__FLOWVIS_INITIAL_PAGE__ = page;
      function tryShow() {
        if (typeof window.showPage === 'function') {
          window.showPage(page);
          return true;
        }
        return false;
      }

      if (tryShow()) return;
      let tries = 0;
      const t = setInterval(() => {
        tries++;
        if (tryShow() || tries > 30) clearInterval(t);
      }, 100);
    })();
  </script>

  <!-- ═══════════════════════════════════════════
       NAV
  ═══════════════════════════════════════════ -->
  <nav>
    <div class="logo" onclick="showPage('home')">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">Flow<b>Vis</b></div>
    </div>
    <div class="nav-links">
      <button class="nl" onclick="showPage('explore')">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 14 14">
          <rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/>
          <rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/>
        </svg>
        Explore
      </button>
      <button class="nl" onclick="showPage('ai')">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 14 14">
          <path d="M7 1v12M1 7h12" stroke-linecap="round"/>
        </svg>
        AI Generate
      </button>
    </div>
    <div class="nav-right">
      <div class="nav-search">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 14 14">
          <circle cx="6" cy="6" r="4"/><path d="M10 10l2.5 2.5" stroke-linecap="round"/>
        </svg>
        <input type="text" placeholder="Search systems..." id="nav-search-input">
        <span class="kbd">⌘K</span>
      </div>
      <button class="nav-cta" onclick="showPage('preview')">Preview</button>
    </div>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="src/js/app.js"></script>
</body></html>
